server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permanent redirect from old Terms & Conditions to new Terms & Policies route
    location = /terms-and-conditions {
        return 301 /legal/terms-policies;
    }

    location = /terms-and-conditions/ {
        return 301 /legal/terms-policies;
    }

    # Permanent redirect from old Fee Refund Policy to new route
    location = /fee-refund-policy {
        return 301 /legal/fee-refund;
    }

    location = /fee-refund-policy/ {
        return 301 /legal/fee-refund;
    }

    # Permanent redirect from old Child Protection Policy to new route
    location = /child-protection-policy {
        return 301 /legal/child-protection;
    }

    location = /child-protection-policy/ {
        return 301 /legal/child-protection;
    }

    # Permanent redirect from old Cookie Policy to new route
    location = /cookie-policy {
        return 301 /legal/cookie-policy;
    }

    location = /cookie-policy/ {
        return 301 /legal/cookie-policy;
    }

    # Permanent redirect from old Legal Disclaimer to new route
    location = /legal-disclaimer {
        return 301 /legal/legal-disclaimer;
    }

    location = /legal-disclaimer/ {
        return 301 /legal/legal-disclaimer;
    }

    # Permanent redirect from old contact-us to new contact route
    location = /contact-us {
        return 301 /contact;
    }

    location = /contact-us/ {
        return 301 /contact;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}